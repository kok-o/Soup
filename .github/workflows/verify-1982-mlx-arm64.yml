name: Verify Qwen2-VL SFT on macOS arm64

on:
  push:
    branches: ['verify/1982-mlx-arm64']

permissions:
  contents: read

jobs:
  vision-sft:
    if: github.repository == 'kok-o/Soup'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install the vision runtime without the PyTorch training extra
        run: |
          python -m pip install -e '.[mlx-vision]' 'mlx==0.32.4' 'transformers==5.19.0' pytest
          python -m pip check
          python -c 'import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ("torch", "trl", "peft"))'
      - name: Record architecture and MLX device
        run: |
          python -c 'import platform, mlx.core as mx; assert platform.machine() == "arm64"; print(platform.platform(), mx.default_device(), "Metal:", mx.metal.is_available())'
      - name: Run config and routing tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m pytest -o addopts= -q tests/test_mlx_vision_sft.py tests/test_mlx_dispatch.py
      - name: Train, save and reload a tiny native Qwen2-VL
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: python benchmarks/harness/verify_1982_mlx_vision.py
